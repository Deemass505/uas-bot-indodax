name: tick
on:
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil bot
        run: |
          curl -sS --fail-with-body --retry 2 --retry-delay 5 --max-time 90 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.TICK_URL }}"
